# Production override for dedicated hardware server deployment.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tunnel up -d --build
#
# Differences from dev docker-compose.yml:
# - Uses Gunicorn (3 workers) instead of Django's dev `runserver`.
# - Does NOT auto-run `seed_demo` on startup (real store/project data stays clean).
# - Binds Postgres & backend ports to 127.0.0.1 only (external access goes through
#   Cloudflare Named Tunnel or a local reverse proxy).
# - Persists private uploads & staticfiles in named volumes.

services:
  db:
    ports: !override
      - "127.0.0.1:5434:5432"

  backend:
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 3 --timeout 60"
    ports: !override
      - "127.0.0.1:8001:8001"
    volumes: !override
      - cpms_private_media:/app/private_media
      - cpms_staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  pos_outbox:
    volumes: !override
      - cpms_private_media:/app/private_media

  cloudflared:
    env_file:
      - path: ./tunnel/cloudflared.env
        required: true
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --edge-ip-version 4 --protocol http2 run

volumes:
  cpms_private_media:
  cpms_staticfiles:
